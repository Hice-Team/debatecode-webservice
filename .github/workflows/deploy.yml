name: Deploy to Cloudflare Workers

# Windows에서는 `opennextjs-cloudflare build`가 크래시한다(OpenNext 공식 Windows 비호환).
# 그래서 배포 빌드는 항상 리눅스 러너에서 돈다 — 로컬에서 손으로 배포할 필요가 없게.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '빌드까지만 하고 배포는 건너뛴다'
        type: boolean
        default: false

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # ── 빌드 시점에 있어야 하는 값 ──────────────────────────────────
      # NEXT_PUBLIC_* 은 클라이언트 번들에 인라인되므로 런타임 시크릿으로는
      # 절대 대체되지 않는다. 여기서 빠지면 배포는 성공하는데 브라우저에서
      # Supabase 클라이언트가 조용히 죽는다.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_CHANNEL_PLUGIN_KEY: ${{ secrets.NEXT_PUBLIC_CHANNEL_PLUGIN_KEY }}
      NEXT_PUBLIC_GOOGLE_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_API_KEY }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_PUBLIC_WEBAUTHN_RPID: ${{ secrets.NEXT_PUBLIC_WEBAUTHN_RPID }}
      NEXT_PUBLIC_WEBAUTHN_ORIGIN: ${{ secrets.NEXT_PUBLIC_WEBAUTHN_ORIGIN }}
      # prisma generate가 datasource url을 읽는다(연결하지는 않는다)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Prisma 클라이언트 생성
        run: npx prisma generate

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 린트
        run: npm run lint

      - name: OpenNext 빌드
        run: npx opennextjs-cloudflare build

      - name: Cloudflare Workers 배포
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 배포 후 헬스체크
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          set -e
          URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}"
          if [ -z "$URL" ]; then echo "NEXT_PUBLIC_SITE_URL 미설정 — 헬스체크 건너뜀"; exit 0; fi
          # 전파에 몇 초 걸린다
          sleep 10
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "$URL/api/health"
